[package]
name = "process-tree-guard"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Runs one command under a finite deadline and ends the whole process tree at the deadline."
license = "Apache-2.0"
repository = "https://github.com/WikdSolvemProbler/process-tree-guard"
readme = "README.md"
keywords = ["process", "deadline", "process-tree", "windows", "job-object"]
categories = ["command-line-utilities"]
include = ["/src/**/*.rs", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/POLICY.md", "/tests/support/testkit.rs",
    "/src/sys/linux/deployment/50-process-tree-guard-ref.rules.in",
    "/src/sys/linux/deployment/process-tree-guard.socket",
    "/src/sys/linux/deployment/process-tree-guard@.service",
    "/src/sys/linux/entry_timer.c",
    "/src/sys/linux/entry_timer.h",
    "/src/sys/linux/kernel_signal_abi.c",
    "/src/sys/linux/native_arming.c",
    "/src/sys/linux/native_arming.h",
    "/src/sys/linux/owner_poll.h",
    "/src/sys/linux/owner_watch.h",
    "/src/sys/linux/payload_bootstrap.c",
    "/src/sys/linux/payload_bootstrap.h",
    "/src/sys/linux/terminal_bridge.c",
    "/src/sys/linux/terminal_bridge.h",
    "/src/sys/linux/waitid_bridge.c",
    "/src/sys/linux/waitid_bridge.h"
]
build = "build.rs"
autobins = false

[lib]
name = "process_tree_guard"
path = "src/lib.rs"

# The full command, installed in bin.
[[bin]]
name = "process-tree-guard"
path = "src/main.rs"

# The deadline role, installed in libexec.
[[bin]]
name = "process-tree-guard-deadline"
path = "src/bin/process-tree-guard-deadline.rs"

# The hook role, installed in libexec.
[[bin]]
name = "process-tree-guard-gate"
path = "src/bin/process-tree-guard-gate.rs"

# The contain role, installed in libexec.
[[bin]]
name = "process-tree-guard-contain"
path = "src/bin/process-tree-guard-contain.rs"

[[bin]]
name = "ptg"
path = "src/bin/ptg.rs"

# The test helper executable. It is built only for a test run, which turns the feature on
# through the development dependency below; `cargo build` and `cargo install` do not build it.
[[bin]]
name = "testkit"
path = "tests/support/testkit.rs"
required-features = ["testkit"]

# Dedicated acknowledged separate-service Linux components; never a default backend.
[[bin]]
name = "process-tree-guard-root"
path = "src/bin/process-tree-guard-linux-root.rs"
edition = "2024"
required-features = ["linux-separate-service"]
test = false

[[bin]]
name = "process-tree-guard-client"
path = "src/bin/process-tree-guard-linux-client.rs"
edition = "2024"
required-features = ["linux-separate-service"]
test = true

[features]
testkit = []
linux-separate-service = []

[dev-dependencies]
process-tree-guard = { path = ".", features = ["testkit"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
