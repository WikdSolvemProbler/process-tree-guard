<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="process-tree-guard: every command ends on time, and nothing it started is left behind">
<rect width="1280" height="400" fill="#0d1117"/>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="72" y="150" font-size="64" font-weight="700" fill="#f0f6fc">process-tree-guard</text>
<text x="72" y="205" font-size="28" fill="#9198a1">Every command ends on time,</text>
<text x="72" y="243" font-size="28" fill="#9198a1">and nothing it started is left behind.</text>
<text x="72" y="318" font-size="18" fill="#3fb950" font-weight="600">Windows job objects  &#183;  exit 124 at the deadline  &#183;  Rust, no crates</text>
</g>
<g font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="16">
<rect x="700" y="92" width="512" height="216" rx="14" fill="#161b22"/>
<circle cx="728" cy="118" r="6" fill="#ff5f57"/><circle cx="748" cy="118" r="6" fill="#febc2e"/><circle cx="768" cy="118" r="6" fill="#28c840"/>
<text x="724" y="164" fill="#e6edf3">&gt; process-tree-guard --timeout 60 -- npm test</text>
<text x="724" y="198" fill="#ff7b72">PROCESS_TIMEOUT: exceeded 60 seconds;</text>
<text x="724" y="224" fill="#ff7b72">terminating process tree</text>
<text x="724" y="262" fill="#e6edf3">&gt; $LASTEXITCODE</text>
<text x="724" y="290" fill="#3fb950" font-weight="700">124</text>
</g>
</svg>