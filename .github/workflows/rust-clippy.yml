name: rust-clippy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 5 * * 0'

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain and Windows target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-msvc --no-self-update

      - name: Lint the Windows crate
        run: cargo +stable clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc
