#
# Continuous integration for process-tree-guard.
#
# check:  type and borrow check of the library, the programs and the test code on four
#         Windows targets, in debug and release, with warnings denied. The check runs on
#         Linux. It compiles every target and executes none of them.
# build:  release build of the programs for x86_64-pc-windows-msvc on Windows, then the
#         library unit tests, then an artifact that holds the four programs.
# build-arm64: release build of the programs for aarch64-pc-windows-msvc on a Windows 11 Arm64
#         hosted runner, then the library and shared process behavior tests run natively
#         on Arm64, then an artifact that holds the programs.
# minimum-rust: the same check with the toolchain named by rust-version in Cargo.toml.
#
# The full integration suite needs Git Bash paths and an interactive desktop session.
# Run it with `cargo test --release` on a Windows machine that has
# Git Bash; CONTRIBUTING.md states how.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"

jobs:
  check:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
          - x86_64-pc-windows-gnu
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain and the target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Check, debug
        run: cargo check --locked --all-targets --target "${{ matrix.target }}"

      - name: Check, release
        run: cargo check --release --locked --all-targets --target "${{ matrix.target }}"

  minimum-rust:
    name: minimum-rust (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared minimum toolchain and the target
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      - name: Check, release
        run: cargo check --release --locked --all-targets --target x86_64-pc-windows-msvc

      - name: Verify the unsupported Linux backend refuses to build
        timeout-minutes: 2
        run: |
          receipt="$RUNNER_TEMP/unsupported-backend.jsonl"
          status=0
          timeout --signal=KILL 75s cargo check --locked --offline --lib --target x86_64-unknown-linux-gnu --message-format=json > "$receipt" || status=$?
          python3 - "$status" "$receipt" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = [json.loads(line) for line in Path(sys.argv[2]).read_text().splitlines()]
          failures = []
          for record in records:
              if record["reason"] != "compiler-message" or record["message"]["level"] != "error":
                  continue
              message = record["message"]
              primary = [span["file_name"] for span in message["spans"] if span["is_primary"] is True]
              target = record["target"]
              failures.append((target["name"], target["kind"], message["message"], primary))
          finished = [record["success"] for record in records if record["reason"] == "build-finished"]
          expected = ("process_tree_guard", ["lib"],
                      "this build has no proven backend for its target; the proven backend at this version is Windows",
                      ["src/sys/mod.rs"])
          if (int(sys.argv[1]) != 101 or len(finished) != 1 or finished[0] is not False
                  or failures != [expected]):
              sys.exit(f"Unexpected backend refusal: Cargo {sys.argv[1]}, finished={finished}, errors={failures}")
          print("Verified the intentional unsupported-backend error.")
          PY

  build:
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain and the target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Build, release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --all-targets

      # The library unit tests only; the integration suite is not run here (see the top of this file).
      - name: Test the library, release
        run: cargo test --release --locked --lib

      - name: Upload the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-tree-guard-x86_64-pc-windows-msvc
          path: |
            target/x86_64-pc-windows-msvc/release/process-tree-guard.exe
            target/x86_64-pc-windows-msvc/release/process-tree-guard-deadline.exe
            target/x86_64-pc-windows-msvc/release/process-tree-guard-gate.exe
            target/x86_64-pc-windows-msvc/release/process-tree-guard-contain.exe
            target/x86_64-pc-windows-msvc/release/ptg.exe
          if-no-files-found: error
          retention-days: 30

  build-arm64:
    name: build (aarch64-pc-windows-msvc)
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain and the target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Build, release
        run: cargo build --release --locked --target aarch64-pc-windows-msvc --all-targets

      - name: Test the library, release
        run: cargo test --release --locked --lib --target aarch64-pc-windows-msvc

      - name: Test shared process behavior natively
        shell: pwsh
        timeout-minutes: 8
        run: ./.github/scripts/test-windows-arm64.ps1

      - name: Upload the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-tree-guard-aarch64-pc-windows-msvc
          path: |
            target/aarch64-pc-windows-msvc/release/process-tree-guard.exe
            target/aarch64-pc-windows-msvc/release/process-tree-guard-deadline.exe
            target/aarch64-pc-windows-msvc/release/process-tree-guard-gate.exe
            target/aarch64-pc-windows-msvc/release/process-tree-guard-contain.exe
            target/aarch64-pc-windows-msvc/release/ptg.exe
          if-no-files-found: error
          retention-days: 30
